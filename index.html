</style></head><body><div class="w">
<h1><b>Goofish</b> → <i>Авито</i></h1>

<div class="ft">Заметки о ликвидности — общая база по трендам, не живые данные. Нажми «Правка», чтобы записать, что реально продаётся на Авито. Цены ¥ — только где известен ориентир.</div>

const $=i=>document.getElementById(i);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let base=RAW.split('\n').map((l,i)=>{const [t,n,q,l2,p]=l.split('|');return{id:'b'+i,t,n,q:q||n,l:l2,p:p?p.split('-').map(Number):null}});
let stars=ld('stars',[]),cust=ld('cust',[]),notes=ld('notes',{}),f='ALL';
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
function toast(m){const t=$('t');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1400)}
function chips(){const c=[['ALL','Все'],['★','★ Цели ('+stars.length+')'],...Object.keys(T).map(k=>[k,T[k][0]])];
$('ch').innerHTML=c.map(([k,n])=>'<button class="chip'+(f==k?' on':'')+'" data-f="'+k+'">'+(T[k]?'<span class="d" style="background:'+T[k][1]+'"></span>':'')+n+'</button>').join('')}
function render(){chips();const q=$('q').value.trim().toLowerCase(),b=parseFloat($('bd').value);
let a=[...cust.map(x=>({...x,c:1})),...base].filter(x=>(f=='ALL'||(f=='★'?stars.includes(x.id):x.t==f))&&(!q||(x.n+x.q).toLowerCase().includes(q))&&(isNaN(b)||(x.p&&x.p[0]<=b)));
a.sort((x,y)=>stars.includes(y.id)-stars.includes(x.id));
$('cn').textContent=a.length+' брендов'+(isNaN(b)?'':' с известным ориентиром цены до '+b+' ¥');
$('ls').innerHTML=a.map(x=>{const n=notes[x.id],s=stars.includes(x.id);
return'<div class="card" style="--c:'+T[x.t][1]+'"><div class="top"><div class="nm">'+E(x.n)+'</div><span class="tg">'+T[x.t][0]+'</span><button class="st'+(s?' on':'')+'" data-s="'+x.id+'">'+(s?'★':'☆')+'</button></div>'+
'<div class="lq">'+E(n||x.l||'—')+'<small>'+(n?'твоя заметка':x.l?'общая база, не проверено':'нет данных — добавь')+'</small></div>'+
'<div class="act"><button class="btn cp" data-c="'+E(x.q)+'">Копировать: '+E(x.q)+'</button><button class="btn" data-e="'+x.id+'">Правка</button>'+(x.c?'<button class="btn" data-d="'+x.id+'">Удалить</button>':'')+(x.p?'<span class="pr">'+x.p[0]+'–'+x.p[1]+' ¥</span>':'')+'</div></div>'}).join('')||'<div class="sub">Ничего не найдено. Измени фильтр или добавь бренд ниже.</div>'}
$('at').innerHTML=Object.keys(T).map(k=>'<option value="'+k+'">'+T[k][0]+'</option>').join('');$('at').value='B';
document.addEventListener('click',e=>{const d=e.target.closest('button');if(!d)return;const D=d.dataset;
if(D.f){f=D.f}else if(D.s){stars=stars.includes(D.s)?stars.filter(i=>i!=D.s):[...stars,D.s];sv('stars',stars)}
else if(D.c){(navigator.clipboard?navigator.clipboard.writeText(D.c):Promise.reject()).catch(()=>{const t=document.createElement('textarea');t.value=D.c;document.body.append(t);t.select();document.execCommand('copy');t.remove()});toast('Скопировано');return}
else if(D.e){const x=[...cust,...base].find(i=>i.id==D.e),v=prompt('Что сейчас ликвидно у бренда '+x.n+'?',notes[x.id]||x.l||'');if(v===null)return;if(v.trim())notes[x.id]=v.trim();else delete notes[x.id];sv('notes',notes)}
else if(D.d){if(!confirm('Удалить бренд?'))return;cust=cust.filter(i=>i.id!=D.d);sv('cust',cust)}
else if(d.id=='ab'){const n=$('an').value.trim();if(!n){toast('Введи название');return}
cust.unshift({id:'c'+Date.now(),t:$('at').value,n,q:$('aq').value.trim()||n,l:$('al').value.trim(),p:null});sv('cust',cust);['an','aq','al'].forEach(i=>$(i).value='');toast('Добавлено')}
else return;render()});
$('q').oninput=render;$('bd').oninput=render;render();
